name: Build Worldender JARs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unpack Worldender source
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' | head -1)"
          test -n "$ZIP"
          mkdir -p /tmp/worldender
          unzip -q "$ZIP" -d /tmp/worldender
          NEO="$(find /tmp/worldender -type f -name 'build.gradle' -path '*neoforge-1.21.1*' -printf '%h\n' | head -1)"
          FORGE="$(find /tmp/worldender -type f -name 'build.gradle' -path '*forge-1.20.1*' -printf '%h\n' | head -1)"
          test -n "$NEO"
          test -n "$FORGE"
          echo "NEO=$NEO" >> "$GITHUB_ENV"
          echo "FORGE=$FORGE" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge 1.20.1
        run: gradle --no-daemon --stacktrace build
        working-directory: /tmp/worldender/worldender_ci/forge-1.20.1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build NeoForge 1.21.1
        run: gradle --no-daemon --stacktrace build
        working-directory: /tmp/worldender/worldender_ci/neoforge-1.21.1

      - name: Collect JARs
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          find /tmp/worldender -type f -path '*/build/libs/*.jar' -exec cp {} artifacts/ \;
          ls -lah artifacts

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: Worldender-JARs
          path: artifacts/*.jar
          if-no-files-found: error
