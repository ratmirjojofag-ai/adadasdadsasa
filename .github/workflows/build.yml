name: Build Worldender JARs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack all source archives
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/worldender
          mkdir -p /tmp/worldender
          shopt -s nullglob
          zips=(./*.zip)
          test ${#zips[@]} -gt 0
          for zip in "${zips[@]}"; do
            echo "Unpacking: $zip"
            unzip -q -o "$zip" -d /tmp/worldender
          done
          echo "Gradle projects found:"
          find /tmp/worldender -type f \( -name build.gradle -o -name build.gradle.kts \) -print

      - name: Patch Forge 1.20.1 compatibility
        shell: bash
        run: |
          set -euxo pipefail
          FORGE="$(find /tmp/worldender -type f -name build.gradle -path '*forge-1.20.1*' -printf '%h\n' | head -1)"
          test -n "$FORGE"
          python3 - "$FORGE" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          p = root / "src/main/java/com/kodari/worldender/WorldenderMod.java"
          s = p.read_text()
          s = s.replace("import net.minecraft.world.GameRules;", "import net.minecraft.world.level.GameRules;")
          s = s.replace("import net.minecraftforge.event.world.BiomeLoadingEvent;\n", "")
          s = re.sub(r"\n\s*@SubscribeEvent\s*\n\s*public void biomeLoading\(BiomeLoadingEvent event\)\s*\{\s*\n\s*WorldGeneration\.addOres\(event\);\s*\n\s*\}\s*\n?", "\n", s)
          p.write_text(s)
          p = root / "src/main/java/com/kodari/worldender/compat/CreateNewAgeCompat.java"
          s = p.read_text().replace("blockEntity instanceof EnergyBlockEntity be ? new Adapter(be) : null", "new Adapter(blockEntity)")
          p.write_text(s)
          p = root / "src/main/java/com/kodari/worldender/EnergyBlockEntity.java"
          s = p.read_text().replace("new ItemStack(Items.COPPER_NUGGET, 12)", "new ItemStack(Items.RAW_COPPER, 2)")
          p.write_text(s)
          p = root / "src/main/java/com/kodari/worldender/WorldGeneration.java"
          p.write_text("""package com.kodari.worldender;

          /** Forge 1.20.1 compatibility build: legacy biome-loading ore hook disabled. */
          public final class WorldGeneration {
              private WorldGeneration() {}
          }
          """)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge 1.20.1
        shell: bash
        run: |
          set -euxo pipefail
          FORGE="$(find /tmp/worldender -type f -name build.gradle -path '*forge-1.20.1*' -printf '%h\n' | head -1)"
          test -n "$FORGE"
          echo "Building Forge project: $FORGE"
          cd "$FORGE"
          gradle --no-daemon --stacktrace build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build NeoForge 1.21.1
        shell: bash
        run: |
          set -euxo pipefail
          NEO="$(find /tmp/worldender -type f -name build.gradle -path '*neoforge-1.21.1*' -printf '%h\n' | head -1)"
          test -n "$NEO"
          echo "Building NeoForge project: $NEO"
          cd "$NEO"
          gradle --no-daemon --stacktrace build

      - name: Collect JARs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          find /tmp/worldender -type f -path '*/build/libs/*.jar' -exec cp {} artifacts/ \;
          ls -lah artifacts

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: Worldender-JARs
          path: artifacts/*.jar
          if-no-files-found: error
